name: نشر تلقائي - شمسان نيوز

on:
  schedule:
    # كل ساعة — بافتراض ~2.5-3 دقيقة لكل تشغيلة، هذا يبقيك ضمن الحصة
    # المجانية (2000 دقيقة/شهر لمستودع Private): 24 × 3 × 30 ≈ 2160 كحد
    # أقصى نظري، وأقل فعلياً بفضل الـ cache أدناه. راقب الاستهلاك من
    # Settings → Billing → Actions، وارجع لوتيرة أسرع (مثلاً */30) لو
    # لاحظت هامش كافٍ.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # يسمح بتشغيل يدوي فوري من تبويب Actions للاختبار

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # يخزّن المكتبات المثبّتة مؤقتاً لتسريع التشغيلات القادمة

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل بوت النشر
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python auto_publish_shmsan.py
